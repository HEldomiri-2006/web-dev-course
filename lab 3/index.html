<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <h1>Todo App</h1>

    <!-- Add a new todo -->
    <div class="add-row">
      <input id="todo-input" type="text" placeholder="What needs doing?" />
      <button id="add-btn">Add</button>
    </div>

    <!-- Tip + filter buttons -->
    <div class="toolbar">
      <span class="tip">Tip: double-click a todo to edit. Press Enter to save.</span>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
    </div>

    <!-- The todos are added here by script.ts -->
    <ul id="todo-list"></ul>

    <!-- Footer -->
    <div class="footer">
      <span id="count">0 items left</span>
      <div>
        <button id="clear-completed" class="small-btn">Clear completed</button>
        <button id="clear-all" class="small-btn">Clear all</button>
      </div>
    </div>
  </div>

  <!-- The browser runs the compiled JavaScript, not the .ts file -->
  <script src="script.js"></script>
</body>
</html>
